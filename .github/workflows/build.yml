name: Build and test

# The project is written on Windows, where the Apple SDKs do not exist. This is
# the only place the code meets a compiler, so it runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "--- simulators ---"
          xcrun simctl list devices available | grep -i "iPhone" || true

      # Builds the app target and the test bundle without needing a booted
      # simulator, so a compile failure is reported as a compile failure rather
      # than as a device-not-found error.
      - name: Compile app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project KoolSkool.xcodeproj \
            -scheme KoolSkool \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Compile errors
        if: failure()
        run: |
          echo "=============== ERRORS ==============="
          grep -E "error:" build.log | sort -u || echo "(no lines matched 'error:')"
          echo "=============== WARNINGS ==============="
          grep -E "warning:" build.log | sort -u | head -60 || true

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project KoolSkool.xcodeproj \
            -scheme KoolSkool \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log

      - name: Test failures
        if: failure()
        run: |
          if [ -f test.log ]; then
            echo "=============== FAILURES ==============="
            grep -E "(✘|✗|failed|error:|XCTAssert)" test.log | sort -u | head -120 || true
          else
            echo "Tests did not run — the compile step failed first."
          fi

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
